[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netlog-ai"
version = "2.2.0"
description = "AI-powered network syslog analyzer with pluggable LLM providers (local Docker Model Runner / Anthropic Claude / xAI Grok) and lab adapters."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Georgi Gaydarov" }]
keywords = ["network", "syslog", "log-analysis", "ai", "llm", "claude", "grok", "frr", "junos", "eos", "bgp", "ospf", "sonic", "cumulus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=5.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "gunicorn>=23.0",
    "regex>=2024.7.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Upper-bounded: new ruff majors change default rules/formatting, so a bump is deliberate.
    "ruff>=0.5,<1",
    "mypy>=1.10",
    "hypothesis>=6.100",
    # tests/test_remediation_export.py parses the generated Ansible playbooks.
    "pyyaml>=6.0",
    # tests/test_packaging.py reads this file. Python 3.10 has no stdlib tomllib, and
    # the test skips without a TOML parser — so on 3.10 the guard would silently stop
    # guarding. pytest currently pulls tomli in transitively there; declare it so the
    # guard doesn't depend on that continuing to be true.
    'tomli>=2.0; python_version < "3.11"',
]
# MCP SDK 2.x required (FastMCP was renamed to MCPServer and moved to
# mcp.server.mcpserver). The server was ported in PR #20 / issue #17.
mcp = ["mcp>=2,<3"]
# textfsm + ntc-templates replace the withdrawn tfsm-fire package (issue #19).
# Do not point this extra at a PEP 508 direct reference — PyPI rejects those.
# tests/test_packaging.py still forbids the dead `tfsm-fire` distribution name.
parse = ["textfsm>=1.1.3", "ntc-templates>=4.0"]
all = ["mcp>=2,<3", "textfsm>=1.1.3", "ntc-templates>=4.0"]

[project.urls]
Homepage = "https://github.com/gesh75/netlog-ai"
Repository = "https://github.com/gesh75/netlog-ai"
Issues = "https://github.com/gesh75/netlog-ai/issues"

[project.scripts]
ai-log-analyzer = "ai_log_analyzer.cli:main"
netlog-ai      = "ai_log_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Demo bundles ship in the wheel so pip/Docker installs boot with data
ai_log_analyzer = ["py.typed", "data/samples/*", "data/sites/**/*", "data/eval/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: a typo'd or unregistered marker fails collection instead of silently
# selecting nothing. Register any new marker below before using it.
addopts = "-q --strict-markers"
markers = [
    "unit: fast unit tests with no external dependencies",
    "integration: tests that hit docker / network / LLM",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pinned and widened rule set. Historical defaults (E4, E7, E9, F) plus safe cosmetic rules
# (FURB167 regex flags, I isort, UP pyupgrade, RET501 return-none, PLR1711 useless-return).
select = ["E4", "E7", "E9", "F", "FURB167", "I", "UP", "RET501", "PLR1711"]
# E701/E702: compact one-line guards (`if x: return y`) are the established style here
ignore = ["E701", "E702"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
files = ["src"]

# baseline: burn down. These modules fail `mypy src` today; each override should be
# removed (and the module fixed) over time. Modules NOT listed here are fully checked,
# so new modules start clean.
[[tool.mypy.overrides]]
module = [
    "ai_log_analyzer.adapters.frr",
    "ai_log_analyzer.adapters.network_tool",
    "ai_log_analyzer.analytics",
    "ai_log_analyzer.analyzer",
    "ai_log_analyzer.causal",
    "ai_log_analyzer.cli",
    "ai_log_analyzer.compliance",
    "ai_log_analyzer.correlate",
    "ai_log_analyzer.deep_report",
    "ai_log_analyzer.entity_state",
    "ai_log_analyzer.judge",
    "ai_log_analyzer.llm",
    "ai_log_analyzer.mcp_server.server",
    "ai_log_analyzer.memory",
    "ai_log_analyzer.rag",
    "ai_log_analyzer.reports",
    "ai_log_analyzer.servicenow_sync",
    "ai_log_analyzer.site_diagram",
    "ai_log_analyzer.sources.syslog",
    "ai_log_analyzer.stability",
    "ai_log_analyzer.topology_infer",
    "ai_log_analyzer.work_shift",
]
ignore_errors = true
