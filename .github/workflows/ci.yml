name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml as the pre-publish gate, so a tag can never ship code
  # that has not passed exactly these checks.
  workflow_call:

permissions:
  contents: read

# New pushes to a PR supersede older runs; never cancel runs on main or release gates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Fixed name: the `main` branch ruleset requires the checks "test (3.10)", "test (3.11)" and
    # "test (3.12)". Without this the matrix's extra `experimental` key would rename them
    # (e.g. "test (3.12, false)") and the required checks would never report.
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 3.13 is experimental until the dependency set is confirmed on it.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        experimental: [false]
        include:
          - python-version: "3.13"
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Two-step so a broken *base* dependency set can't hide behind the extras,
      # and so an unresolvable extra fails on a line that names the extra.
      - name: Install (base + dev)
        run: pip install -e ".[dev]"
      - name: Install (all extras)
        run: pip install -e ".[dev,all]"
      - name: Lint
        run: ruff check src/ tests/
      # Blocking: the 9 baseline mypy errors were fixed on branch
      # plan/p0-ci-gates (suppression / evpn_causal / timeutil), so a new
      # type error must fail the PR here, not slip through.
      - name: Type check (mypy)
        run: mypy src
      # Coverage is gated at the measured baseline (83% on 2026-11-11) minus
      # 2 points: the floor stops silent erosion, it does not demand growth.
      - name: Test
        run: pytest -p no:warnings --tb=short --cov=ai_log_analyzer --cov-report=term-missing:skip-covered --cov-fail-under=81
      # Blocking: pip-audit --strict fails on any known vulnerability.
      # pip itself is upgraded first so the runner's own pip version
      # (12 findings on pip 24.0, none in project deps) cannot turn
      # unrelated PRs red. A genuinely vulnerable dependency must be fixed
      # or explicitly accepted with --ignore-vuln + a comment saying why.
      - name: Dependency audit (pip-audit)
        if: matrix.python-version == '3.12'
        run: |
          pip install --upgrade pip
          pip install pip-audit
          pip-audit --skip-editable --strict

  a11y:
    # WCAG-AA audit of the dashboard (scripts/audit-a11y.cjs): boots the
    # real web UI, walks 5 UI states, fails on critical/serious axe
    # violations. ADVISORY (continue-on-error) for now: a local run on
    # 2026-11-11 found 6 AA blockers (1 critical + 5 serious, incl.
    # label-content-name-mismatch on the side tabs) — the dashboard does
    # not pass yet. Once those are fixed, remove continue-on-error so the
    # gate blocks. See the work plan (P0.5).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (base + dev + all extras)
        run: pip install -e ".[dev,all]"
      - name: Install a11y tooling
        run: |
          mkdir -p /tmp/a11y && cd /tmp/a11y && npm init -y >/dev/null
          npm install playwright @axe-core/playwright
          ./node_modules/.bin/playwright install chromium --with-deps
      - name: Start the web UI
        run: |
          nohup netlog-ai serve > /tmp/netlog-ai-serve.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:6060/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:6060/ >/dev/null
      - name: Accessibility audit (WCAG-AA, advisory)
        continue-on-error: true
        run: NODE_PATH=/tmp/a11y/node_modules node scripts/audit-a11y.cjs

  build:
    # PR-time proof that the sdist+wheel build, pass metadata checks and actually ship
    # the demo data/UI. Previously this was only discovered after a release tag.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Install the wheel into a clean venv and verify
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/pip check
          # Run from outside the checkout so src/ cannot shadow the installed wheel.
          cd /tmp && /tmp/wheel-venv/bin/python "$GITHUB_WORKSPACE/.github/scripts/smoke_wheel.py"
