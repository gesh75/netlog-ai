name: Release

# Publishes to PyPI via trusted publishing (no API token in secrets).
# One-time setup on pypi.org: project "netlog-ai" → Publishing → add
# GitHub publisher: owner=gesh75, repo=netlog-ai, workflow=release.yml,
# environment=pypi. Then: git tag v0.2.0 && git push origin v0.2.0
#
# Pipeline: gate (full CI: lint + tests + build check) → build (tag == pyproject
# version, twine check, pip check, wheel data smoke test) → pypi + github-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Re-runs the whole CI workflow against the tagged commit. pypi and github-release
  # both depend on it, so a tag on a red commit publishes nothing.
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must equal v<pyproject version>
        run: python .github/scripts/check_tag_version.py "$GITHUB_REF_NAME" pyproject.toml
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Install the wheel into a clean venv and verify
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/pip check
      - name: Smoke-test the wheel ships demo data + UI
        # Run from outside the checkout so src/ cannot shadow the installed wheel.
        run: cd /tmp && /tmp/wheel-venv/bin/python "$GITHUB_WORKSPACE/.github/scripts/smoke_wheel.py"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release notes from this version's CHANGELOG section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Everything between "## [VERSION]" and the next "## [" heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/gesh75/netlog-ai/blob/main/CHANGELOG.md)." > notes.md
          fi
          printf '\n---\nFull history: [CHANGELOG.md](https://github.com/gesh75/netlog-ai/blob/main/CHANGELOG.md)\n' >> notes.md
          wc -l notes.md
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --title "netlog-ai $TAG" \
              --notes-file notes.md
          fi
